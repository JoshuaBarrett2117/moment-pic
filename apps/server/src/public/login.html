<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moment Pic 登录</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-card">
        <p class="eyebrow">Moment Pic / Local Gallery</p>
        <h1>登录</h1>
        <p class="login-tip">默认账号：admin</p>
        <form id="login-form" class="login-form">
          <label>
            <span>账号</span>
            <input class="control" name="username" value="admin" autocomplete="username" required />
          </label>
          <label>
            <span>密码</span>
            <input class="control" type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="button button-primary" type="submit">登录</button>
        </form>
        <p class="status" id="login-status">请输入账号密码后登录</p>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
