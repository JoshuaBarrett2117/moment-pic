services:
  gallery:
    build: .
    image: moment-pic:latest
    container_name: moment-pic
    ports:
      - "${PORT:-3210}:3210"
    environment:
      HOST: "0.0.0.0"
      PORT: "3210"
      LIBRARY_ROOTS: "${LIBRARY_ROOTS}"
      CACHE_DIR: "${CACHE_DIR:-/data/cache}"
      SQLITE_PATH: "${SQLITE_PATH:-/data/gallery.sqlite}"
      INDEX_FILE_PATH: "${INDEX_FILE_PATH:-/data/index.json}"
      DATABASE_URL: "${DATABASE_URL:-file:/data/gallery.sqlite}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - gallery-data:/data
    restart: unless-stopped

volumes:
  gallery-data:
