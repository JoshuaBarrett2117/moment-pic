services:
  gallery:
    init: true
    # 非 root 部署前在宿主机执行：chown -R 1000:1000 /volume4/docker/moment-pic/config
    # 覆盖 gallery.sqlite、-wal、-shm 和 cache；数据库卷必须使用本地 ext4/btrfs，不能放 NFS/SMB。
    build: .
    image: moment-pic:latest
    container_name: moment-pic
    ports:
      - "${PORT:-3210}:3210"
    environment:
      HOST: "0.0.0.0"
      PORT: "3210"
      # 首次启动必填（创建 admin）；之后以页面上修改的密码为准
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-}
      AI_API_TOKEN: ${AI_API_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      LIBRARY_ROOTS: "${LIBRARY_ROOTS:-/data/library}"
      CACHE_MAX_BYTES: "${CACHE_MAX_BYTES:-5368709120}"
      CACHE_GC_MIN_AGE_HOURS: "${CACHE_GC_MIN_AGE_HOURS:-24}"
      CACHE_GC_INTERVAL_HOURS: "${CACHE_GC_INTERVAL_HOURS:-6}"
      CACHE_DIR: "${CACHE_DIR:-/data/cache}"
      SQLITE_PATH: "${SQLITE_PATH:-/data/gallery.sqlite}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - gallery-data:/data
      - "${LIBRARY_HOST_PATH:-./apps/server/samples/library}:/data/library:ro"
    restart: unless-stopped

volumes:
  gallery-data:
